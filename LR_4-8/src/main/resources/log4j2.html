<Configuration status="WARN">
    <Appenders>
        <!-- Файл логів -->
        <File name="FileLogger" fileName="app.logs" append="true">
            <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level: %msg%n%throwable"/>
        </File>

        <!-- Налаштування e-mail -->
        <SMTP name="EmailLogger" subject="Critical Error in Application"
              to="lopskadiana@gmail.com"
              from="diana-marta.lopska.oi.2023@lpnu.ua"
              smtpHost="smtp.gmail.com"
              smtpPort="587"
              smtpUsername="diana-marta.lopska.oi.2023@lpnu.ua"
              smtpPassword="quhe nzul ophz dmwi"
              smtpProtocol="smtp"
              bufferSize="1"
              ignoreExceptions="false">
            <Property name="mail.smtp.starttls.enable">true</Property>
            <Property name="mail.smtp.auth">true</Property>
            <PatternLayout pattern="%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %msg%n%throwable"/>
            <Filters>
                <ThresholdFilter level="ERROR" onMatch="ACCEPT" onMismatch="DENY"/>
            </Filters>
        </SMTP>
    </Appenders>

    <Loggers>
        <Root level="info"> <!-- Установка рівня кореневого логера -->
            <AppenderRef ref="FileLogger"/>
            <AppenderRef ref="EmailLogger"/>
        </Root>
        <Logger name="ErrorLogger" level="error" additivity="false">
            <AppenderRef ref="FileLogger"/>
            <AppenderRef ref="EmailLogger"/>
        </Logger>
    </Loggers>
</Configuration>
